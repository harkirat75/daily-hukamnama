
<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Hukamnama Sahib</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #111827;
  color: white;
  font-family: 'Noto Sans Gurmukhi', sans-serif;
  text-align: center;
  padding: 35px 25px;
}

.heading {
  color: #e5bd70;
  font-size: clamp(28px, 3vw, 44px);
  font-weight: 700;
  margin-bottom: 20px;
}

#indiaDate {
  font-size: clamp(22px, 2.5vw, 32px);
  margin-bottom: 8px;
}

#indiaTime {
  color: #e5bd70;
  font-size: 20px;
  margin-bottom: 25px;
}

#ang {
  color: #e5bd70;
  font-size: 23px;
  margin-bottom: 15px;
}

#writer {
  color: #e5bd70;
  font-size: 22px;
  margin-bottom: 25px;
}

#hukamnama {
  font-size: clamp(25px, 3vw, 43px);
  line-height: 2;
  max-width: 1400px;
  margin: auto;
  font-weight: 500;
}

.verse {
  margin-bottom: 22px;
}

#status {
  color: #e5bd70;
  margin-top: 20px;
  font-size: 15px;
}

.footer {
  margin-top: 40px;
  color: #e5bd70;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="heading">ੴ ਹੁਕਮਨਾਮਾ ਸਾਹਿਬ ੴ</div>

<div id="indiaDate"></div>
<div id="indiaTime"></div>

<div id="ang"></div>
<div id="writer"></div>

<div id="hukamnama">
ਹੁਕਮਨਾਮਾ ਸਾਹਿਬ ਲੋਡ ਹੋ ਰਿਹਾ ਹੈ...
</div>

<div id="status"></div>

<div class="footer">
ਸ੍ਰੀ ਦਰਬਾਰ ਸਾਹਿਬ, ਅੰਮ੍ਰਿਤਸਰ
</div>

<script>

const weekdays = [
'ਐਤਵਾਰ','ਸੋਮਵਾਰ','ਮੰਗਲਵਾਰ',
'ਬੁੱਧਵਾਰ','ਵੀਰਵਾਰ','ਸ਼ੁੱਕਰਵਾਰ','ਸ਼ਨੀਵਾਰ'
];

const months = [
'ਜਨਵਰੀ','ਫਰਵਰੀ','ਮਾਰਚ','ਅਪ੍ਰੈਲ',
'ਮਈ','ਜੂਨ','ਜੁਲਾਈ','ਅਗਸਤ',
'ਸਤੰਬਰ','ਅਕਤੂਬਰ','ਨਵੰਬਰ','ਦਸੰਬਰ'
];

function getIndiaDate() {

  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Kolkata',
    weekday: 'long',
    day: 'numeric',
    month: 'numeric',
    year: 'numeric'
  }).formatToParts(new Date());

  const get = type =>
    parts.find(p => p.type === type).value;

  const year = Number(get('year'));
  const month = Number(get('month'));
  const day = Number(get('day'));

  const weekday = [
    'Sunday','Monday','Tuesday',
    'Wednesday','Thursday','Friday','Saturday'
  ].indexOf(get('weekday'));

  return {
    iso: year + '-' +
      String(month).padStart(2,'0') + '-' +
      String(day).padStart(2,'0'),

    formatted: weekdays[weekday] + ', ' +
      day + ' ' + months[month - 1] + ' ' + year
  };
}

function updateClock() {

  const india = getIndiaDate();

  const time = new Intl.DateTimeFormat('en-IN', {
    timeZone: 'Asia/Kolkata',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: true
  }).format(new Date());

  document.getElementById('indiaDate').textContent =
    india.formatted;

  document.getElementById('indiaTime').textContent =
    time;
}

async function loadHukamnama() {

  const text = document.getElementById('hukamnama');
  const ang = document.getElementById('ang');
  const writer = document.getElementById('writer');
  const status = document.getElementById('status');

  const india = getIndiaDate();

  try {

    const response = await fetch(
      './hukamnama.json?t=' + Date.now(),
      { cache: 'no-store' }
    );

    if (!response.ok) {
      throw new Error('Hukamnama file not found');
    }

    const data = await response.json();

    if (data.iso_date !== india.iso) {
      throw new Error('Waiting for today’s Hukamnama');
    }

    if (!Array.isArray(data.verses) ||
        data.verses.length === 0) {
      throw new Error('No verses found');
    }

    const lines = data.verses
      .map(v => v.gurmukhi)
      .filter(Boolean);

    if (!lines.length) {
      throw new Error('Gurmukhi unavailable');
    }

    text.replaceChildren();

    lines.forEach(line => {
      const verse = document.createElement('div');
      verse.className = 'verse';
      verse.textContent = line;
      text.appendChild(verse);
    });

    ang.textContent = 'ਅੰਗ ' + data.ang;

    // Display everything in Gurmukhi
    const raagNames = {
      'Raag Dhanaasree': 'ਰਾਗ ਧਨਾਸਰੀ',
      'Dhanaasree': 'ਰਾਗ ਧਨਾਸਰੀ'
    };

    const writerNames = {
      'Bhagat Kabeer Ji': 'ਭਗਤ ਕਬੀਰ ਜੀ',
      'Bhagat Kabir Ji': 'ਭਗਤ ਕਬੀਰ ਜੀ'
    };

    const raag =
      raagNames[data.raag] || data.raag;

    const author =
      writerNames[data.writer] || data.writer;

    writer.textContent = raag + ' · ' + author;

    status.textContent = '';

  } catch (error) {

    console.error(error);

    status.textContent =
      'ਨਵੇਂ ਹੁਕਮਨਾਮੇ ਦੀ ਉਡੀਕ ਹੈ।';
  }
}

updateClock();
loadHukamnama();

setInterval(updateClock, 1000);

setInterval(loadHukamnama, 15 * 60 * 1000);

</script>

</body>
</html>
