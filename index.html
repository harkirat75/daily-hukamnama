
<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Daily Hukamnama Sahib</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #111827;
  color: white;
  font-family: 'Noto Sans Gurmukhi', sans-serif;
  text-align: center;
  padding: 35px 25px;
}

.heading {
  color: #e5bd70;
  font-size: clamp(28px, 3vw, 44px);
  font-weight: 700;
  margin-bottom: 20px;
}

#indiaDate {
  font-size: clamp(22px, 2.5vw, 32px);
  margin-bottom: 12px;
}

#indiaTime {
  color: #e5bd70;
  font-size: 18px;
  margin-bottom: 25px;
}

#ang {
  color: #e5bd70;
  font-size: 23px;
  margin-bottom: 30px;
}

#hukamnama {
  font-size: clamp(25px, 3vw, 43px);
  line-height: 2;
  max-width: 1400px;
  margin: auto;
  white-space: pre-line;
  font-weight: 500;
}

#sourceDate {
  color: #9ca3af;
  font-size: 16px;
  margin-top: 25px;
}

#status {
  color: #f0c674;
  font-size: 16px;
  margin-top: 20px;
}

.footer {
  margin-top: 40px;
  color: #e5bd70;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="heading">ੴ ਹੁਕਮਨਾਮਾ ਸਾਹਿਬ ੴ</div>

<div id="indiaDate"></div>
<div id="indiaTime"></div>

<div id="ang"></div>

<div id="hukamnama">
ਹੁਕਮਨਾਮਾ ਸਾਹਿਬ ਲੋਡ ਹੋ ਰਿਹਾ ਹੈ...
</div>

<div id="sourceDate"></div>
<div id="status"></div>

<div class="footer">
ਸ੍ਰੀ ਦਰਬਾਰ ਸਾਹਿਬ, ਅੰਮ੍ਰਿਤਸਰ
</div>

<script>

const API_BASE =
'https://api.gurbaninow.com/v2/hukamnama';

// Punjabi date names
const weekdays = [
  'ਐਤਵਾਰ',
  'ਸੋਮਵਾਰ',
  'ਮੰਗਲਵਾਰ',
  'ਬੁੱਧਵਾਰ',
  'ਵੀਰਵਾਰ',
  'ਸ਼ੁੱਕਰਵਾਰ',
  'ਸ਼ਨੀਵਾਰ'
];

const months = [
  'ਜਨਵਰੀ',
  'ਫਰਵਰੀ',
  'ਮਾਰਚ',
  'ਅਪ੍ਰੈਲ',
  'ਮਈ',
  'ਜੂਨ',
  'ਜੁਲਾਈ',
  'ਅਗਸਤ',
  'ਸਤੰਬਰ',
  'ਅਕਤੂਬਰ',
  'ਨਵੰਬਰ',
  'ਦਸੰਬਰ'
];

// Get current date in India
function getIndiaDate() {

  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Kolkata',
    weekday: 'long',
    day: 'numeric',
    month: 'numeric',
    year: 'numeric'
  }).formatToParts(new Date());

  const get = name =>
    parts.find(p => p.type === name).value;

  const dayName = get('weekday');
  const day = Number(get('day'));
  const month = Number(get('month'));
  const year = Number(get('year'));

  const weekdayIndex = [
    'Sunday', 'Monday', 'Tuesday',
    'Wednesday', 'Thursday', 'Friday',
    'Saturday'
  ].indexOf(dayName);

  return {
    year,
    month,
    day,
    weekdayIndex,
    formatted:
      weekdays[weekdayIndex] + ', ' +
      day + ' ' + months[month - 1] +
      ' ' + year
  };
}

// Display Indian date and time
function updateClock() {

  const india = getIndiaDate();

  const time = new Intl.DateTimeFormat('en-IN', {
    timeZone: 'Asia/Kolkata',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: true
  }).format(new Date());

  document.getElementById('indiaDate').textContent =
    'ਭਾਰਤ ਵਿੱਚ ਅੱਜ ਦੀ ਤਾਰੀਖ: ' + india.formatted;

  document.getElementById('indiaTime').textContent =
    'ਭਾਰਤੀ ਸਮਾਂ: ' + time;
}

// Load Hukamnama for exact Indian date
async function loadHukamnama() {

  const text = document.getElementById('hukamnama');
  const ang = document.getElementById('ang');
  const sourceDate = document.getElementById('sourceDate');
  const status = document.getElementById('status');

  const india = getIndiaDate();

  const url =
    API_BASE + '/' +
    india.year + '/' +
    india.month + '/' +
    india.day +
    '?_=' + Date.now();

  updateClock();

  status.textContent = 'ਹੁਕਮਨਾਮਾ ਚੈੱਕ ਕੀਤਾ ਜਾ ਰਿਹਾ ਹੈ...';

  try {

    const response = await fetch(url, {
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error(
        'Todays Hukamnama is not available yet'
      );
    }

    const data = await response.json();

    if (!data.hukamnama ||
        !Array.isArray(data.hukamnama) ||
        data.hukamnama.length === 0) {
      throw new Error('No Hukamnama available');
    }

    const lines = data.hukamnama
      .map(item => item.line.gurmukhi.unicode)
      .filter(Boolean);

    if (lines.length === 0) {
      throw new Error('Gurmukhi text unavailable');
    }

    // Display Gurbani
    text.textContent = lines.join('\n');

    // Display Ang number
    ang.textContent =
      'ਅੰਗ ' + data.hukamnamainfo.pageno;

    // Confirm publication date
    const d = data.date && data.date.gregorian;

    if (d) {

      const returnedDate =
        d.year + '-' +
        String(d.month).padStart(2, '0') + '-' +
        String(d.date).padStart(2, '0');

      const requestedDate =
        india.year + '-' +
        String(india.month).padStart(2, '0') + '-' +
        String(india.day).padStart(2, '0');

      if (returnedDate !== requestedDate) {
        throw new Error(
          'Returned Hukamnama date does not match India date'
        );
      }

      sourceDate.textContent =
        'ਹੁਕਮਨਾਮੇ ਦੀ ਤਾਰੀਖ: ' + india.formatted;
    } else {
      sourceDate.textContent =
        'ਹੁਕਮਨਾਮੇ ਦੀ ਤਾਰੀਖ: ' + india.formatted;
    }

    status.textContent = '';

  } catch (error) {

    console.error(error);

    text.textContent =
      'ਅੱਜ ਦਾ ਹੁਕਮਨਾਮਾ ਹਾਲੇ ਉਪਲਬਧ ਨਹੀਂ ਹੈ।';

    ang.textContent = '';
    sourceDate.textContent = '';

    status.textContent =
      'ਨਵਾਂ ਹੁਕਮਨਾਮਾ ਉਪਲਬਧ ਹੋਣ ਤੇ ਆਪਣੇ ਆਪ ਅੱਪਡੇਟ ਹੋਵੇਗਾ।';
  }
}

// Start page
updateClock();
loadHukamnama();

// Update clock every second
setInterval(updateClock, 1000);

// Check exact-date Hukamnama every 15 minutes
setInterval(loadHukamnama, 15 * 60 * 1000);

</script>

</body>
</html>
