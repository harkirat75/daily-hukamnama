
<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Daily Hukamnama Sahib</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #111827;
  color: white;
  font-family: 'Noto Sans Gurmukhi', sans-serif;
  text-align: center;
  padding: 35px 25px;
}

.heading {
  color: #e5bd70;
  font-size: clamp(28px, 3vw, 44px);
  font-weight: 700;
  margin-bottom: 20px;
}

#indiaDate {
  font-size: clamp(22px, 2.5vw, 32px);
  color: #ffffff;
  margin-bottom: 12px;
}

#indiaTime {
  color: #e5bd70;
  font-size: 18px;
  margin-bottom: 25px;
}

#ang {
  color: #e5bd70;
  font-size: 23px;
  margin-bottom: 30px;
}

#hukamnama {
  font-size: clamp(25px, 3vw, 43px);
  line-height: 2;
  max-width: 1400px;
  margin: auto;
  white-space: pre-line;
  font-weight: 500;
}

#sourceDate {
  color: #9ca3af;
  font-size: 16px;
  margin-top: 25px;
}

#status {
  color: #9ca3af;
  font-size: 14px;
  margin-top: 15px;
}

.footer {
  margin-top: 40px;
  color: #e5bd70;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="heading">ੴ ਹੁਕਮਨਾਮਾ ਸਾਹਿਬ ੴ</div>

<div id="indiaDate"></div>
<div id="indiaTime"></div>

<div id="ang"></div>

<div id="hukamnama">
ਹੁਕਮਨਾਮਾ ਸਾਹਿਬ ਲੋਡ ਹੋ ਰਿਹਾ ਹੈ...
</div>

<div id="sourceDate"></div>
<div id="status"></div>

<div class="footer">
ਸ੍ਰੀ ਦਰਬਾਰ ਸਾਹਿਬ, ਅੰਮ੍ਰਿਤਸਰ
</div>

<script>

const API_URL =
'https://api.gurbaninow.com/v2/hukamnama/today';

// Always use India timezone for the date
function updateIndiaClock() {

  const now = new Date();

  const date = new Intl.DateTimeFormat('pa-IN', {
    timeZone: 'Asia/Kolkata',
    weekday: 'long',
    day: 'numeric',
    month: 'long',
    year: 'numeric'
  }).format(now);

  const time = new Intl.DateTimeFormat('en-IN', {
    timeZone: 'Asia/Kolkata',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: true
  }).format(now);

  document.getElementById('indiaDate').textContent =
    'ਭਾਰਤ ਵਿੱਚ ਅੱਜ ਦੀ ਤਾਰੀਖ: ' + date;

  document.getElementById('indiaTime').textContent =
    'ਭਾਰਤੀ ਸਮਾਂ: ' + time;
}

// Load daily Hukamnama
async function loadHukamnama() {

  const text = document.getElementById('hukamnama');
  const ang = document.getElementById('ang');
  const sourceDate = document.getElementById('sourceDate');
  const status = document.getElementById('status');

  updateIndiaClock();

  try {

    const response = await fetch(
      API_URL + '?refresh=' + Date.now(),
      { cache: 'no-store' }
    );

    if (!response.ok) {
      throw new Error('API unavailable');
    }

    const data = await response.json();

    if (!data.hukamnama ||
        !Array.isArray(data.hukamnama) ||
        data.hukamnama.length === 0) {
      throw new Error('No Hukamnama available');
    }

    const lines = data.hukamnama
      .map(item => item.line.gurmukhi.unicode)
      .filter(Boolean);

    if (!lines.length) {
      throw new Error('Gurmukhi text unavailable');
    }

    text.textContent = lines.join('\n');

    ang.textContent =
      'ਅੰਗ ' + data.hukamnamainfo.pageno;

    // Show actual publication date separately
    const d = data.date && data.date.gregorian;

    if (d) {
      const actualDate = new Date(
        Date.UTC(d.year, d.month - 1, d.date)
      );

      const formatted = new Intl.DateTimeFormat('pa-IN', {
        timeZone: 'Asia/Kolkata',
        day: 'numeric',
        month: 'long',
        year: 'numeric'
      }).format(actualDate);

      sourceDate.textContent =
        'ਹੁਕਮਨਾਮੇ ਦੀ ਪ੍ਰਕਾਸ਼ਿਤ ਤਾਰੀਖ: ' + formatted;
    }

    status.textContent = 'ਹੁਕਮਨਾਮਾ ਅੱਪਡੇਟ ਹੋ ਗਿਆ';

  } catch (error) {

    status.textContent =
      'ਹੁਕਮਨਾਮਾ ਲੋਡ ਨਹੀਂ ਹੋ ਸਕਿਆ।';

    console.error(error);
  }
}

// Initial load
updateIndiaClock();
loadHukamnama();

// Update India date and time every second
setInterval(updateIndiaClock, 1000);

// Check for new Hukamnama every 15 minutes
setInterval(loadHukamnama, 15 * 60 * 1000);

</script>

</body>
</html>
