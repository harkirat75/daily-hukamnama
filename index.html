
<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Daily Hukamnama Sahib</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #111827;
  color: #ffffff;
  font-family: 'Noto Sans Gurmukhi', sans-serif;
  text-align: center;
  padding: 35px 25px;
}

.heading {
  color: #e5bd70;
  font-size: clamp(26px, 3vw, 42px);
  font-weight: 700;
  margin-bottom: 15px;
}

#date {
  font-size: clamp(18px, 2vw, 25px);
  color: #ffffff;
  margin-bottom: 12px;
}

#ang {
  color: #e5bd70;
  font-size: 22px;
  margin-bottom: 30px;
}

#hukamnama {
  font-size: clamp(25px, 3vw, 43px);
  line-height: 2;
  max-width: 1400px;
  margin: auto;
  white-space: pre-line;
  font-weight: 500;
}

#status {
  color: #9ca3af;
  font-size: 14px;
  margin-top: 20px;
}

.footer {
  margin-top: 40px;
  color: #e5bd70;
  font-size: 17px;
}

</style>
</head>

<body>

<div class="heading">ੴ ਹੁਕਮਨਾਮਾ ਸਾਹਿਬ ੴ</div>

<div id="date">ਲੋਡ ਹੋ ਰਿਹਾ ਹੈ...</div>

<div id="ang"></div>

<div id="hukamnama">
  ਹੁਕਮਨਾਮਾ ਸਾਹਿਬ ਲੋਡ ਹੋ ਰਿਹਾ ਹੈ...
</div>

<div id="status"></div>

<div class="footer">
  ਸ੍ਰੀ ਦਰਬਾਰ ਸਾਹਿਬ, ਅੰਮ੍ਰਿਤਸਰ
</div>

<script>

const API_URL =
'https://api.gurbaninow.com/v2/hukamnama/today';

function showIndiaDate() {

  const indiaDate = new Intl.DateTimeFormat('pa-IN', {
    timeZone: 'Asia/Kolkata',
    weekday: 'long',
    day: 'numeric',
    month: 'long',
    year: 'numeric'
  }).format(new Date());

  document.getElementById('date').textContent =
    'ਅੱਜ ਦੀ ਤਾਰੀਖ: ' + indiaDate;
}

async function loadHukamnama() {

  const text = document.getElementById('hukamnama');
  const ang = document.getElementById('ang');
  const status = document.getElementById('status');

  showIndiaDate();

  try {

    const response = await fetch(API_URL, {
      cache: 'no-store'
    });

    if (!response.ok) {
      throw new Error('API unavailable');
    }

    const data = await response.json();

    if (!data.hukamnama ||
        !Array.isArray(data.hukamnama) ||
        data.hukamnama.length === 0) {
      throw new Error('No Hukamnama data');
    }

    // Display Ang number
    ang.textContent =
      'ਅੰਗ ' + data.hukamnamainfo.pageno;

    // Display only Gurmukhi Gurbani
    const lines = data.hukamnama
      .map(item => item.line.gurmukhi.unicode)
      .filter(line => line);

    if (lines.length === 0) {
      throw new Error('Gurmukhi text unavailable');
    }

    text.textContent = lines.join('\n');

    // Display actual API Hukamnama date if available
    const apiDate = data.date &&
                    data.date.gregorian;

    if (apiDate) {
      const actualDate = new Date(
        Date.UTC(
          apiDate.year,
          apiDate.month - 1,
          apiDate.date
        )
      );

      const formattedApiDate =
        new Intl.DateTimeFormat('pa-IN', {
          timeZone: 'Asia/Kolkata',
          weekday: 'long',
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        }).format(actualDate);

      status.textContent =
        'ਹੁਕਮਨਾਮੇ ਦੀ ਤਾਰੀਖ: ' + formattedApiDate;
    } else {
      status.textContent = '';
    }

  } catch (error) {

    text.textContent =
      'ਹੁਕਮਨਾਮਾ ਲੋਡ ਨਹੀਂ ਹੋ ਸਕਿਆ।';

    status.textContent =
      'ਕਿਰਪਾ ਕਰਕੇ ਇੰਟਰਨੈੱਟ ਕਨੈਕਸ਼ਨ ਜਾਂ API ਚੈੱਕ ਕਰੋ।';

    console.error(error);
  }
}

// Load immediately
loadHukamnama();

// Refresh Hukamnama every 15 minutes
setInterval(loadHukamnama, 15 * 60 * 1000);

// Refresh India date every minute
setInterval(showIndiaDate, 60 * 1000);

</script>

</body>
</html>
