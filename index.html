
<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Daily Hukamnama Sahib</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  background: #111827;
  color: white;
  font-family: 'Noto Sans Gurmukhi', sans-serif;
  text-align: center;
  padding: 35px 25px;
}

.heading {
  color: #e5bd70;
  font-size: clamp(28px, 3vw, 44px);
  font-weight: 700;
  margin-bottom: 20px;
}

#indiaDate {
  font-size: clamp(22px, 2.5vw, 32px);
  margin-bottom: 12px;
}

#indiaTime {
  color: #e5bd70;
  font-size: 18px;
  margin-bottom: 25px;
}

#ang {
  color: #e5bd70;
  font-size: 23px;
  margin-bottom: 30px;
}

#writer {
  color: #e5bd70;
  font-size: 20px;
  margin-bottom: 20px;
}

#hukamnama {
  font-size: clamp(25px, 3vw, 43px);
  line-height: 2;
  max-width: 1400px;
  margin: auto;
  font-weight: 500;
}

.verse {
  margin-bottom: 22px;
}

#sourceDate {
  color: #9ca3af;
  font-size: 16px;
  margin-top: 25px;
}

#status {
  color: #e5bd70;
  font-size: 14px;
  margin-top: 15px;
}

.footer {
  margin-top: 40px;
  color: #e5bd70;
  font-size: 18px;
}
</style>
</head>

<body>

<div class="heading">ੴ ਹੁਕਮਨਾਮਾ ਸਾਹਿਬ ੴ</div>

<div id="indiaDate"></div>
<div id="indiaTime"></div>

<div id="ang"></div>
<div id="writer"></div>

<div id="hukamnama">
ਹੁਕਮਨਾਮਾ ਸਾਹਿਬ ਲੋਡ ਹੋ ਰਿਹਾ ਹੈ...
</div>

<div id="sourceDate"></div>
<div id="status"></div>

<div class="footer">
ਸ੍ਰੀ ਦਰਬਾਰ ਸਾਹਿਬ, ਅੰਮ੍ਰਿਤਸਰ
</div>

<script>

const API_URL =
'https://harjyo.com/api/hukamnama/today';

const weekdays = [
'ਐਤਵਾਰ',
'ਸੋਮਵਾਰ',
'ਮੰਗਲਵਾਰ',
'ਬੁੱਧਵਾਰ',
'ਵੀਰਵਾਰ',
'ਸ਼ੁੱਕਰਵਾਰ',
'ਸ਼ਨੀਵਾਰ'
];

const months = [
'ਜਨਵਰੀ',
'ਫਰਵਰੀ',
'ਮਾਰਚ',
'ਅਪ੍ਰੈਲ',
'ਮਈ',
'ਜੂਨ',
'ਜੁਲਾਈ',
'ਅਗਸਤ',
'ਸਤੰਬਰ',
'ਅਕਤੂਬਰ',
'ਨਵੰਬਰ',
'ਦਸੰਬਰ'
];

function getIndiaDate() {

  const parts = new Intl.DateTimeFormat('en-US', {
    timeZone: 'Asia/Kolkata',
    weekday: 'long',
    day: 'numeric',
    month: 'numeric',
    year: 'numeric'
  }).formatToParts(new Date());

  const get = type =>
    parts.find(p => p.type === type).value;

  const year = Number(get('year'));
  const month = Number(get('month'));
  const day = Number(get('day'));

  const weekdayIndex = [
    'Sunday','Monday','Tuesday',
    'Wednesday','Thursday','Friday','Saturday'
  ].indexOf(get('weekday'));

  return {
    year,
    month,
    day,
    iso: year + '-' +
      String(month).padStart(2,'0') + '-' +
      String(day).padStart(2,'0'),
    formatted:
      weekdays[weekdayIndex] + ', ' +
      day + ' ' + months[month - 1] +
      ' ' + year
  };
}

function updateClock() {

  const india = getIndiaDate();

  const time = new Intl.DateTimeFormat('en-IN', {
    timeZone: 'Asia/Kolkata',
    hour: '2-digit',
    minute: '2-digit',
    second: '2-digit',
    hour12: true
  }).format(new Date());

  document.getElementById('indiaDate').textContent =
    'ਭਾਰਤ ਵਿੱਚ ਅੱਜ ਦੀ ਤਾਰੀਖ: ' + india.formatted;

  document.getElementById('indiaTime').textContent =
    'ਭਾਰਤੀ ਸਮਾਂ: ' + time;
}

async function loadHukamnama() {

  const text = document.getElementById('hukamnama');
  const ang = document.getElementById('ang');
  const writer = document.getElementById('writer');
  const sourceDate = document.getElementById('sourceDate');
  const status = document.getElementById('status');

  const india = getIndiaDate();

  try {

    const response = await fetch(
      API_URL + '?_=' + Date.now(),
      { cache: 'no-store' }
    );

    if (!response.ok) {
      throw new Error('Feed unavailable');
    }

    const data = await response.json();

    // Never show an older day's Gurbani as today's
    if (data.iso_date !== india.iso) {
      throw new Error(
        'Waiting for today’s Hukamnama publication'
      );
    }

    if (!Array.isArray(data.verses) ||
        data.verses.length === 0) {
      throw new Error('No Gurbani verses available');
    }

    const verses = data.verses
      .map(v => v.gurmukhi)
      .filter(Boolean);

    if (!verses.length) {
      throw new Error('Gurmukhi unavailable');
    }

    // Display each Gurbani verse separately
    text.replaceChildren();

    verses.forEach(line => {
      const verse = document.createElement('div');
      verse.className = 'verse';
      verse.textContent = line;
      text.appendChild(verse);
    });

    ang.textContent = 'ਅੰਗ ' + data.ang;

    writer.textContent =
      data.raag + ' · ' + data.writer;

    sourceDate.textContent =
      'ਹੁਕਮਨਾਮੇ ਦੀ ਤਾਰੀਖ: ' + india.formatted;

    status.textContent = '';

  } catch (error) {

    console.error(error);

    status.textContent =
      'ਨਵੇਂ ਹੁਕਮਨਾਮੇ ਦੀ ਉਡੀਕ ਹੈ। ਪੁਰਾਣਾ ਹੁਕਮਨਾਮਾ ਗਲਤ ਤਾਰੀਖ ਨਾਲ ਨਹੀਂ ਦਿਖਾਇਆ ਜਾਵੇਗਾ।';
  }
}

// Start
updateClock();
loadHukamnama();

// Update India clock every second
setInterval(updateClock, 1000);

// Check for new Hukamnama every 15 minutes
setInterval(loadHukamnama, 15 * 60 * 1000);

</script>

</body>
</html>
