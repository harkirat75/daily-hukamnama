
<!DOCTYPE html>
<html lang="pa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Hukamnama Sahib</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gurmukhi:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #111827;
  color: #fff;
  font-family: 'Noto Sans Gurmukhi', sans-serif;
  text-align: center;
  padding: 35px;
}

.heading {
  color: #e5bd70;
  font-size: 32px;
  margin-bottom: 12px;
}

#date {
  font-size: 20px;
  color: #d1d5db;
  margin-bottom: 12px;
}

#ang {
  color: #e5bd70;
  font-size: 19px;
  margin-bottom: 35px;
}

#hukamnama {
  font-size: clamp(24px, 3vw, 42px);
  line-height: 2;
  max-width: 1300px;
  margin: auto;
  white-space: pre-line;
}

.footer {
  margin-top: 35px;
  color: #9ca3af;
  font-size: 13px;
}

</style>
</head>

<body>

<div class="heading">ੴ ਹੁਕਮਨਾਮਾ ਸਾਹਿਬ ੴ</div>

<div id="date">ਹੁਕਮਨਾਮਾ ਲੋਡ ਹੋ ਰਿਹਾ ਹੈ...</div>
<div id="ang"></div>

<div id="hukamnama"></div>

<div class="footer">
  ਸ੍ਰੀ ਦਰਬਾਰ ਸਾਹਿਬ, ਅੰਮ੍ਰਿਤਸਰ
  <br>Daily Hukamnama · GurbaniNow API
</div>

<script>
async function loadHukamnama() {
  const text = document.getElementById('hukamnama');
  const date = document.getElementById('date');
  const ang = document.getElementById('ang');

  try {
    const response = await fetch(
      'https://api.gurbaninow.com/v2/hukamnama/today',
      { cache: 'no-store' }
    );

    if (!response.ok) throw new Error('Unable to load');

    const data = await response.json();

    date.textContent =
      data.date.gregorian.day + ', ' +
      data.date.gregorian.date + ' ' +
      data.date.gregorian.month + ' ' +
      data.date.gregorian.year;

    ang.textContent =
      'ਅੰਗ ' + data.hukamnamainfo.pageno;

    text.textContent = data.hukamnama
      .map(item => item.line.gurmukhi.unicode)
      .join('\n');

  } catch (error) {
    text.textContent =
      'ਹੁਕਮਨਾਮਾ ਲੋਡ ਨਹੀਂ ਹੋ ਸਕਿਆ। ਕਿਰਪਾ ਕਰਕੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।';
  }
}

loadHukamnama();

// Check for a new Hukamnama every 15 minutes
setInterval(loadHukamnama, 15 * 60 * 1000);
</script>

</body>
</html>
